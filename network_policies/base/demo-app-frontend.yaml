# ─────────────────────────────────────────────────────────────────────────────
# Demo App – Frontend (tier=frontend)
#
# Pod de demostración para validación funcional de Network Policies.
# Simula la capa de presentación de una app de 3 niveles.
# El tráfico de benchmark va por iperf-server-np, NO por este pod.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-frontend
  namespace: cni-np-test
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: demo-frontend
    tier: frontend
    app.kubernetes.io/part-of: cni-np-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-frontend
      tier: frontend
  template:
    metadata:
      labels:
        app: demo-frontend
        tier: frontend
        app.kubernetes.io/part-of: cni-np-test
    spec:
      containers:
        - name: frontend
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: demo-frontend
  namespace: cni-np-test
  labels:
    app: demo-frontend
    tier: frontend
    app.kubernetes.io/part-of: cni-np-test
spec:
  selector:
    app: demo-frontend
    tier: frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
