# ─────────────────────────────────────────────────────────────────────────────
# Demo App – Backend (tier=backend)
#
# Simula la capa de lógica de negocio. Expone HTTP en puerto 80.
# NP de use-case-2 permite ingress solo desde frontend.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-backend
  namespace: cni-np-test
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: demo-backend
    tier: backend
    app.kubernetes.io/part-of: cni-np-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-backend
      tier: backend
  template:
    metadata:
      labels:
        app: demo-backend
        tier: backend
        app.kubernetes.io/part-of: cni-np-test
    spec:
      containers:
        - name: backend
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: demo-backend
  namespace: cni-np-test
  labels:
    app: demo-backend
    tier: backend
    app.kubernetes.io/part-of: cni-np-test
spec:
  selector:
    app: demo-backend
    tier: backend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
