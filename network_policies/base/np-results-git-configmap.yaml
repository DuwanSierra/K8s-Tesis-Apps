apiVersion: v1
kind: ConfigMap
metadata:
  name: cni-np-results-git-config
  namespace: cni-np-test
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/part-of: cni-np-test
    component: network-policy-benchmark
data:
  GIT_REPO_URL: "https://github.com/DuwanSierra/K8S-CNI-Results.git"
  GIT_BRANCH: "main"
  GIT_RESULTS_PATH: "results/cni-benchmarks"
  # CNI_NAME y NP_CASE son sobreescritos por el overlay correspondiente
  CNI_NAME: "calico"
  NP_CASE: "zero_trust"
  GIT_AUTHOR_NAME: "cni-benchmark-bot"
  GIT_AUTHOR_EMAIL: "cni-benchmark-bot@example.com"
