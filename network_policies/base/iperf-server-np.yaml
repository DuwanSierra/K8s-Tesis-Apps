# ─────────────────────────────────────────────────────────────────────────────
# iperf3 Server – Network Policy Benchmark (namespace: cni-np-test)
#
# Servidor de benchmark idéntico al de cni-test pero en cni-np-test.
# Label role=benchmark-server lo excluye de las NPs de demo (tier=*).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iperf3-server-np
  namespace: cni-np-test
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: iperf3-server-np
    role: benchmark-server
    app.kubernetes.io/part-of: cni-np-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iperf3-server-np
  template:
    metadata:
      labels:
        app: iperf3-server-np
        role: benchmark-server
        app.kubernetes.io/part-of: cni-np-test
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    role: benchmark-client
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: iperf3-server
          image: networkstatic/iperf3:latest
          args: ["-s", "-p", "5201", "--forceflush"]
          ports:
            - name: iperf3-tcp
              containerPort: 5201
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          readinessProbe:
            exec:
              command: ["sh", "-c", "pidof iperf3 >/dev/null 2>&1"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pidof iperf3 >/dev/null 2>&1"]
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: iperf3-server-np
  namespace: cni-np-test
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: iperf3-server-np
    role: benchmark-server
    app.kubernetes.io/part-of: cni-np-test
spec:
  selector:
    app: iperf3-server-np
  ports:
    - name: iperf3-tcp
      protocol: TCP
      port: 5201
      targetPort: 5201
  type: ClusterIP
