# ─────────────────────────────────────────────────────────────────────────────
# Demo App – Database (tier=database)
#
# Simula la capa de persistencia. NP de use-case-2 permite ingress solo desde
# backend y bloquea todo egress (contención de exfiltración).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-database
  namespace: cni-np-test
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: demo-database
    tier: database
    app.kubernetes.io/part-of: cni-np-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-database
      tier: database
  template:
    metadata:
      labels:
        app: demo-database
        tier: database
        app.kubernetes.io/part-of: cni-np-test
    spec:
      containers:
        - name: database
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: demo-database
  namespace: cni-np-test
  labels:
    app: demo-database
    tier: database
    app.kubernetes.io/part-of: cni-np-test
spec:
  selector:
    app: demo-database
    tier: database
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
